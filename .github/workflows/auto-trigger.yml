name: auto-trigger-sync

# 独立 cron 工作流：错峰触发 sync-data 工作流
#（主 sync-data.yml 的 cron 偶发失效，加这个做兜底）

on:
  schedule:
    - cron: '*/15 * * * *'   # 每 15 分钟（比 */10 触发更稳）
    - cron: '5,20,35,50 * * * *'  # 备用错峰触发
  workflow_dispatch:

permissions:
  contents: write

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: 触发 sync 工作流
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -X POST             -H "Authorization: Bearer $GH_TOKEN"             -H "Accept: application/vnd.github.v3+json"             https://api.github.com/repos/${{ github.repository }}/actions/workflows/sync-data.yml/dispatches             -d '{"ref": "main"}'
          echo "已触发 sync-data workflow"
